# NutriApp - Compose para desarrollo y despliegue (Dokploy)
# Variables: CLIENT_KEY, POSTGRES_USERNAME, POSTGRES_PASSWORD, POSTGRES_DATABASE, NEXTAUTH_URL, NEXTAUTH_SECRET
name: ${CLIENT_KEY}

networks:
  nutriapp-network:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg14
    hostname: ${CLIENT_KEY}-postgres
    container_name: ${CLIENT_KEY}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - nutriapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  nutriapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CLIENT_KEY}-nutriapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutriapp-network

volumes:
  postgres:
